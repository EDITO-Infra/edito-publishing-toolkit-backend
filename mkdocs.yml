site_name: EDITO Publishing Toolkit
site_description: Documentation for the EDITO Publishing Toolkit API and publication workflows.
repo_name: EDITO-Infra/edito-publishing-toolkit
repo_url: https://github.com/EDITO-Infra/edito-publishing-toolkit
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# Slide-deck archive (docs/slides/) stays repo-only; the site serves the
# handbook pages and the demo video.
exclude_docs: |
  slides/
  tutorials/README.md
  **/__pycache__/

nav:
  - Home: index.md
  - Install: install.md
  - Usage: usage.md
  - Docker usage: docker-usage.md
  - Authentication: auth.md
  - S3 storage: s3.md
  - API: api.md
  - Features:
      - Overview: features/index.md
      - Storage:
          - Upload to S3: features/upload-s3.md
          - List your S3 buckets: features/list-s3-buckets.md
      - Conversions:
          - NetCDF to Zarr: features/nc-to-zarr.md
          - GDB to GeoParquet: features/gdb-to-parquet.md
          - Shapefile to GeoParquet: features/shp-to-parquet.md
          - ARCO STAC Item: features/arco-stac-item.md
      - Metadata to STAC Items:
          - ISO to STAC Item: features/iso-to-stac-item.md
          - NetCDF to STAC Item: features/netcdf-to-stac-item.md
          - Zarr to STAC Item: features/zarr-to-stac-item.md
      - STAC tools:
          - Validate STAC: features/validate-stac.md
          - STAC Find: features/stac-find.md
          - STAC Fetch: features/stac-get.md
          - STAC Item Builder: features/stac-build-item.md
          - STAC Collection Builder: features/stac-build-collection.md
          - STAC Catalog Builder: features/stac-build-catalog.md
          - Create Collection Tree: features/create-collection-tree.md
          - Create Catalog Tree: features/create-catalog-tree.md
      - Publishing:
          - Get my catalogs: features/get-my-catalogs.md
          - Publish STAC: features/publish-stac.md
          - Remove STAC: features/remove-stac.md
          - Publication jobs: features/publication-jobs.md
      - Jobs & monitoring:
          - EPT job runner: features/job-runner.md
          - Monitoring: features/monitoring.md
  - Tutorials:
      - tutorials/index.md
      - Session setup: tutorials/session-setup.md
      - Walkthroughs:
          - 1 — Transform data: tutorials/walkthroughs/walkthrough-1-transform.md
          - 2 — A data item: tutorials/walkthroughs/walkthrough-2-data-items.md
          - 3 — Items from metadata: tutorials/walkthroughs/walkthrough-3-metadata-items.md
          - 4 — ARCO items: tutorials/walkthroughs/walkthrough-4-arco.md
          - 5 — Collections: tutorials/walkthroughs/walkthrough-5-collections.md
          - 6 — Catalog: tutorials/walkthroughs/walkthrough-6-catalog.md
          - 7 — Publish: tutorials/walkthroughs/walkthrough-7-publish.md
          - Full walkthrough — bash: tutorials/walkthroughs/full-walkthrough-bash.md
      - Full walkthrough — python: tutorials/full-walkthrough-python.md
      - Full walkthrough — UI: tutorials/full-walkthrough-ui.md
      - EPT Training Session 1: tutorials/ept-training-1.md


theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.indexes
    - navigation.top

plugins:
  - search

extra_javascript:
  - javascripts/screencast-lightbox.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path: docs
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
