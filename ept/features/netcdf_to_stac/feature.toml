[feature]
key = "metadata.netcdf_to_stac_item"
release = "1.1.0"
title = "NetCDF metadata to STAC Item"
description = "Build a STAC Item from the metadata of a NetCDF source (local, S3, or HTTP/OPeNDAP): dimensions, coordinates, data variables, and CF attributes, with spatial and temporal extents derived from coordinates or CF global attributes and overridable per request. The item is written to a local path or S3 key. The collection is optional: only an explicit collection_id attaches the item to an EDITO STAC collection — otherwise the item is standalone and the response carries a suggested_collection_id (a matching EDITO collection, or a kebab-case CF standard_name slug) the user can attach to their own collection later."
depends_on = []

[package]
requires = ["xarray", "netcdf4", "h5netcdf", "pystac", "pandas"]

[entrypoints]
python = ["ept.features.netcdf_to_stac.service:netcdf_to_stac_item"]

[api]
router = "ept.features.netcdf_to_stac.routes:router"

[[api.routes]]
method = "POST"
path = "/v1/metadata/netcdf/to-stac-item"
summary = "Create a STAC Item from NetCDF metadata"
request_model = "ept.features.netcdf_to_stac.models:NetcdfToStacItemRequest"
response_model = "ept.features.netcdf_to_stac.models:NetcdfToStacItemResponse"

[tests]
unit = "tests/features/netcdf_to_stac/test_netcdf_metadata.py"
integration = "tests/features/netcdf_to_stac/test_netcdf_to_stac.py"
